name: Sync Fork

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push commits to your fork
    steps:
      - name: Sync upstream changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} --branch master
